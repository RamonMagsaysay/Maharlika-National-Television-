<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maharlika National Television - MNTV</title>
  <style>
      :root {
  --mntv-blue: #0B3D80;
  --mntv-red: #E10600;
  --mntv-gold: #FFD700;
  --mntv-white: #FFFFFF;
  --mntv-gray: #272727;
  --mntv-dark: #0F0F0F;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #5C0011;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */

.tv-header {
  background: #0B3D80;
  border-bottom: 2px solid var(--mntv-gold);
  padding: 8px 12px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-text h1 {
  font-size: 14px;
  color: var(--mntv-gold);
  line-height: 1.2;
}

.logo-text p {
  font-size: 8px;
  opacity: 0.9;
  color: white;
}

#liveClock {
  font-family: monospace;
  font-size: 11px;

  background: #272727;

  padding: 5px 10px;

  border-radius: 4px;
}

/* TICKER */

.ticker {
  background: gold;
  color: black;

  padding: 6px;

  overflow: hidden;
  white-space: nowrap;

  font-size: 11px;
  font-weight: bold;
}

.ticker span {
  display: inline-block;
  padding-left: 100%;

  animation: scroll 20s linear infinite;
}

@keyframes scroll {
  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-100%);
  }
}

/* CHANNEL BAR */

.channel-bar {
  background: #000;

  border-bottom: 2px solid var(--mntv-gold);

  padding: 10px;

  display: flex;
  gap: 10px;

  overflow-x: auto;
}

.channel-bar::-webkit-scrollbar {
  height: 4px;
}

.channel-bar::-webkit-scrollbar-thumb {
  background: var(--mntv-gold);
}

/* CHANNEL BUTTONS */

.ch-btn {
  background: #8B0000;

  color: white;

  border: 1px solid var(--mntv-gold);

  padding: 8px 16px;

  border-radius: 20px;

  cursor: pointer;

  white-space: nowrap;

  font-weight: 600;

  transition: 0.2s ease;
}

.ch-btn:hover {
  background: var(--mntv-blue);
}

.ch-btn.active {
  background: green;
}

/* MAIN LAYOUT */

.watch-container {
  display: flex;
  gap: 20px;

  padding: 20px;

  max-width: 1400px;

  margin: auto;
}

.player-section {
  flex: 1;
  min-width: 0;
}

.playlist-section {
  width: 350px;
}

/* TV PLAYER */

.tv-player {
  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

  background: #000;

  overflow: hidden;

  border: 3px solid var(--mntv-gold);

  border-radius: 10px;
}

/* ALL MEDIA */

.channel-video,
.channel-audio,
.channel-image,
.radio-ui,
#channelContent,
#channelContent iframe {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;
}

/* VIDEO */

.channel-video {
  display: none;

  object-fit: cover;

  background: #000;

  z-index: 1;
}

/* AUDIO */

.channel-audio {
  display: none;
}

/* IMAGE */

.channel-image {
  display: none;

  object-fit: contain;

  background: #000;

  z-index: 1;
}

/* YOUTUBE */

#channelContent {
  z-index: 1;
}

#channelContent iframe {
  border: none;

  width: 100%;
  height: 100%;

  display: block;
}

/* RADIO */

.radio-ui {
  display: none;

  z-index: 3;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  gap: 20px;

  background:
    linear-gradient(
      135deg,
      #1a1a1a,
      #000
    );
}

.radio-logo {
  width: 120px;
  height: 120px;

  border-radius: 50%;

  background: var(--mntv-blue);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 40px;

  border: 3px solid var(--mntv-gold);
}

/* WAVEFORM */

.waveform {
  display: flex;
  gap: 3px;

  align-items: center;

  height: 40px;
}

.waveform span {
  width: 4px;

  background: var(--mntv-gold);

  animation: wave 1.2s infinite ease-in-out;
}

.waveform span:nth-child(2) {
  animation-delay: 0.1s;
}

.waveform span:nth-child(3) {
  animation-delay: 0.2s;
}

.waveform span:nth-child(4) {
  animation-delay: 0.3s;
}

.waveform span:nth-child(5) {
  animation-delay: 0.4s;
}

@keyframes wave {
  0%, 100% {
    height: 10px;
  }

  50% {
    height: 40px;
  }
}

/* BADGES */

.live-badge,
.vod-badge {
  position: absolute;

  top: 10px;
  right: 10px;

  z-index: 10;

  color: white;

  padding: 4px 10px;

  border-radius: 4px;

  font-size: 10px;
  font-weight: bold;
}

.live-badge {
  background: #E10600;

  animation: pulse 2s infinite;
}

.vod-badge {
  background: #555;
}

@keyframes pulse {
  0% {
    opacity: 1;
  }

  50% {
    opacity: 0.6;
  }

  100% {
    opacity: 1;
  }
}

/* CHANNEL BADGE */

.channel-badge {
  position: absolute;

  top: 10px;
  left: 10px;

  z-index: 10;

  background: rgba(0,0,0,0.7);

  padding: 5px 10px;

  border-radius: 4px;

  font-size: 12px;
  font-weight: bold;
}

/* NO SIGNAL */

.no-signal {
  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  color: #888;

  font-size: 24px;
  font-weight: bold;

  z-index: 5;

  background:
    repeating-linear-gradient(
      0deg,
      #222 0px,
      #222 1px,
      #333 1px,
      #333 2px
    ),
    repeating-linear-gradient(
      90deg,
      #222 0px,
      #222 1px,
      #333 1px,
      #333 2px
    );
}

/* CONTROLS */

.player-controls {
  margin-top: 12px;

  display: flex;
  gap: 10px;
}

.mute-btn {
  background: #272727;

  color: white;

  border: none;

  width: 44px;
  height: 44px;

  border-radius: 50%;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: 0.2s;
}

.mute-btn:hover {
  background: var(--mntv-blue);
}

/* VIDEO INFO */

.video-info h2 {
  margin: 12px 0 5px;

  font-size: 20px;
}

.video-meta {
  color: #aaa;

  font-size: 14px;
}

/* PLAYLIST */

.playlist-item {
  display: flex;
  gap: 10px;

  margin-bottom: 12px;

  padding: 8px;

  border-radius: 6px;

  opacity: 0.7;

  position: relative;

  transition: 0.2s ease;
}

.playlist-item.active {
  opacity: 1;

  background: #272727;

  border-left: 3px solid var(--mntv-blue);
}

/* THUMB */

.thumb {
  width: 120px;
  height: 68px;

  background: #333;

  flex-shrink: 0;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #666;

  font-size: 24px;

  overflow: hidden;

  border-radius: 4px;
}

.thumb img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

/* PLAYLIST TITLE */

.playlist-title {
  font-size: 14px;
  line-height: 1.3;
}

/* ITEM BADGES */

.item-badge {
  position: absolute;

  top: 4px;
  left: 4px;

  font-size: 9px;

  padding: 2px 5px;

  border-radius: 3px;

  font-weight: bold;
}

.item-badge.live {
  background: #E10600;
}

.item-badge.vod {
  background: #555;
}

.item-badge.audio {
  background: #0B3D80;
}

.item-badge.img {
  background: #8B0000;
}

/* FULLSCREEN */

.tv-player:fullscreen {
  width: 100vw;
  height: 100vh;

  aspect-ratio: unset;

  border: none;

  border-radius: 0;
}

.tv-player:-webkit-full-screen {
  width: 100vw;
  height: 100vh;
}

.tv-player:-moz-full-screen {
  width: 100vw;
  height: 100vh;
}

.tv-player:-ms-fullscreen {
  width: 100vw;
  height: 100vh;
}

/* REMOVE DEFAULT CONTROLS */

video::-webkit-media-controls-play-button,
video::-webkit-media-controls-timeline,
video::-webkit-media-controls-current-time-display,
video::-webkit-media-controls-time-remaining-display,
video::-webkit-media-controls-seek-back-button,
video::-webkit-media-controls-seek-forward-button,
video::-webkit-media-controls-fullscreen-button {
  display: none !important;
}

/* MOBILE */

@media (max-width: 900px) {

  .watch-container {
    flex-direction: column;
  }

  .playlist-section {
    width: 100%;
  }

  .tv-header {
    flex-direction: column;
    gap: 10px;

    text-align: center;
  }

  .channel-badge {
    font-size: 10px;
  }

  .video-info h2 {
    font-size: 18px;
  }
    }

  </style>
</head>
<body>
  <header class="tv-header">
      <div class="logo-text">
        <h1>Maharlika National Television</h1>
        <p>The State Media of the State Republic of Maharlika</p>
      </div>
    </div>
    <div id="liveClock">00:00:00 PHT</div>
  </header>
  <div class="channel-bar">
    <button class="ch-btn active" onclick="switchChannel('news')">CH1: Maharlika News</button>
    <button class="ch-btn" onclick="switchChannel('sports')">CH2: Maharlika State Sports</button>
    <button class="ch-btn" onclick="switchChannel('music')">CH3: Music Channel</button>
    <button class="ch-btn" onclick="switchChannel('kids')">CH4: Cartoon TV</button>
    <button class="ch-btn" onclick="switchChannel('radio')">CH5: Radyo Maharlika</button>
    <button class='ch-btn' onclick="switchChannel('government')">CH6: State Republic of Maharlika State Network</button>
  </div>

  <div id="fullscreenOverlay" class="fullscreen-overlay"></div>
  <button id="fullscreenExitBtn" class="fullscreen-exit-btn" onclick="toggleFullscreen()">✕ Exit Fullscreen</button>

  <div class="watch-container">
    <div class="player-section">
      <div class="tv-player" id="tvPlayer">
        <div class="channel-badge" id="channelBadge">MNTV NEWS</div>
        <div id="statusBadge"></div>

        <video id="video-news" class="channel-video"></video>
        <video id="video-sports" class="channel-video"></video>
        <video id="video-music" class="channel-video"></video>
        <video id="video-kids" class="channel-video"></video>
        <video id="video-government" class="channel-video"></video>
        <audio id="audio-radio" class="channel-audio"></audio>
        <iframe id="iframe-news" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-sports" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-music" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-kids" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-government" class="channel-iframe" allowfullscreen="true"></iframe>
        <div id="radio-ui-radio" class="radio-ui">
          <div class="radio-logo">📻</div>
          <div id="radio-title" style="color:var(--mntv-gold);font-weight:bold;"></div>
          <div class="waveform"><span></span><span></span></div>
        </div>
        <img id="image-news" class="channel-image">
        <img id="image-sports" class="channel-image">
        <img id="image-music" class="channel-image">
        <img id="image-kids" class="channel-image">
        <img id="image-government" class="channel-image">

        <div id="channelContent"></div>
      </div>
<div class="player-controls">

  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
    🔊
  </button>

  <button class="mute-btn" onclick="toggleFullscreen()">
    ⛶
  </button>

</div>

      <div class="video-info">
        <h2 id="videoTitle">Select a video</h2>
        <div class="video-meta" id="videoMeta">Maharlika National Television</div>
      </div>
    </div>

    <div class="playlist-section">
      <h3 style="margin-top:0;">Up Next</h3>
      <div id="playlist"></div>
    </div>
  </div>


    <script>
const MNTV_CHANNELS = {
  news: {
    name: 'Maharlika News',
    items: [
      {
        title: 'Auld Lang Syne',
        type: 'youtube',
        file: 'HAFzcjuBAAo',
        isLive: false,
        thumb: null
      }
    ]
  },

  sports: {
    name: 'Maharlika State Sports',
    items: [
      {
        title: 'Auld Lang Syne',
        type: 'youtube',
        file: 'HAFzcjuBAAo',
        isLive: false,
        thumb: null
      }
    ]
  },

  music: {
    name: 'Music Channel',
    items: [
      {
        title: 'Never Gonna Give You Up',
        type: 'youtube',
        file: 'jNQXAC9IVRw',
        isLive: false,
        thumb: null
      },
      {
        title: 'La Mentira',
        type: 'video',
        file: 'la_mentira.mp4',
        isLive: false,
        thumb: 'music_thumb1.jpg'
      }
    ]
  },

  kids: {
    name: 'Cartoon TV',
    items: [
      {
        title: 'Tom and Jerry',
        type: 'youtube',
        file: 't0Q2otsqC4I',
        isLive: true,
        thumb: null
      },
      {
        title: 'Tom and Jerry 2',
        type: 'youtube',
        file: 't0Q2otsqC4I',
        isLive: true,
        thumb: null
      }
    ]
  },

  radio: {
    name: 'Radio Maharlika',
    isRadio: true,
    items: [
      {
        title: 'Test Broadcast',
        type: 'audio',
        file: 'ocean_deep.mp3',
        isLive: false,
        thumb: null
      }
    ]
  },

  government: {
    name: 'SRM State Channel',
    items: [
      {
        title: 'No Broadcast',
        type: null,
        file: null,
        isLive: false,
        thumb: null
      }
    ]
  }
};

let currentChannel = 'news';
let currentItemIndex = {};

Object.keys(MNTV_CHANNELS).forEach(ch => {
  currentItemIndex[ch] = 0;
});

function hideAllMedia() {
  document.querySelectorAll(
    '.channel-video,.channel-audio,.channel-image,.radio-ui'
  ).forEach(el => {

    el.style.display = 'none';

    if (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') {
      el.pause();
      el.currentTime = 0;
      el.muted = true;
    }
  });

  document.getElementById('channelContent').innerHTML = '';
}



function toggleMute() {
  const ch = MNTV_CHANNELS[currentChannel];
  const item = ch.items[currentItemIndex[currentChannel]];

  if (!item) return;

  let mediaEl = null;

  if (item.type === 'video') {
    mediaEl = document.getElementById(`video-${currentChannel}`);
  }

  if (item.type === 'audio') {
    mediaEl = document.getElementById(`audio-${currentChannel}`);
  }

  if (!mediaEl) return;

  mediaEl.muted = !mediaEl.muted;

  const btn = document.getElementById('muteBtn');

  btn.innerHTML = mediaEl.muted
    ? `
      <svg viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63z"/>
      </svg>
    `
    : `
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
      </svg>
    `;
}

function toggleFullscreen() {
  const player = document.getElementById('tvPlayer');

  if (!document.fullscreenElement) {

    if (player.requestFullscreen) {
      player.requestFullscreen();
    }
    else if (player.webkitRequestFullscreen) {
      player.webkitRequestFullscreen();
    }
    else if (player.msRequestFullscreen) {
      player.msRequestFullscreen();
    }

  } else {

    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }

  }
}

function switchChannel(channelKey) {
  currentChannel = channelKey;

  const ch = MNTV_CHANNELS[channelKey];

  if (
    currentItemIndex[channelKey] == null ||
    currentItemIndex[channelKey] >= ch.items.length
  ) {
    currentItemIndex[channelKey] = 0;
  }

  document.querySelectorAll('.ch-btn').forEach((btn, i) => {
    btn.classList.toggle(
      'active',
      Object.keys(MNTV_CHANNELS)[i] === channelKey
    );
  });

  document.getElementById('channelBadge').textContent = ch.name;

  const item = ch.items[currentItemIndex[channelKey]];

  playMedia(channelKey, item);

  renderPlaylist();
}

function playMedia(channelKey, item) {
  hideAllMedia();

  const ch = MNTV_CHANNELS[channelKey];
  const screen = document.getElementById('channelContent');

  document.getElementById('videoTitle').textContent =
    item?.title || 'No Signal';

  document.getElementById('videoMeta').textContent =
    ch.name;

  const badgeEl = document.getElementById('statusBadge');

  if (item?.isLive) {
    badgeEl.className = 'live-badge';
    badgeEl.textContent = '● LIVE';
  }
  else if (item?.file) {
    badgeEl.className = 'vod-badge';
    badgeEl.textContent = 'ON DEMAND';
  }
  else {
    badgeEl.className = '';
    badgeEl.innerHTML = '';
  }

  // NO SIGNAL
  if (!item || !item.file || item.type === null) {
    screen.innerHTML = `
      <div class="no-signal">
        <div>NO SIGNAL</div>
        <div style="font-size:14px;margin-top:10px;">
          Please stand by
        </div>
      </div>
    `;
    return;
  }

  // VIDEO
  if (item.type === 'video') {
    const video = document.getElementById(`video-${channelKey}`);

    if (!video) return;

    video.style.display = 'block';

    if (!video.src.includes(item.file)) {
      video.src = item.file;
      video.load();
      setupEndedListeners(video, channelKey);
    }

    video.muted = false;

    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  }

  // AUDIO
  else if (item.type === 'audio') {
    const audio = document.getElementById(`audio-${channelKey}`);

    if (!audio) return;

    if (!audio.src.includes(item.file)) {
      audio.src = item.file;
      audio.load();
      setupEndedListeners(audio, channelKey);
    }

    audio.style.display = 'block';
    audio.muted = false;

    if (ch.isRadio) {
      const radioUI =
        document.getElementById(`radio-ui-${channelKey}`);

      if (radioUI) {
        radioUI.style.display = 'flex';
      }

      document.getElementById('radio-title').textContent =
        item.title;
    }

    audio.play().catch(() => {
      audio.muted = true;
      audio.play().catch(() => {});
    });
  }

  // IMAGE
  else if (item.type === 'image') {
    const img = document.getElementById(`image-${channelKey}`);

    if (!img) return;

    img.src = item.file;
    img.style.display = 'block';
  }

  // YOUTUBE
  else if (item.type === 'youtube') {

  screen.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${item.file}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1"
      title="${item.title}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;
  }

function setupEndedListeners(mediaEl, channelKey) {
  mediaEl.onended = null;

  mediaEl.onended = () => {
    const ch = MNTV_CHANNELS[channelKey];

    currentItemIndex[channelKey]++;

    if (currentItemIndex[channelKey] >= ch.items.length) {
      currentItemIndex[channelKey] = 0;
    }

    if (currentChannel === channelKey) {
      const next =
        ch.items[currentItemIndex[channelKey]];

      playMedia(channelKey, next);

      renderPlaylist();
    }
  };
}

function nextItem(channelKey) {
  const ch = MNTV_CHANNELS[channelKey];

  currentItemIndex[channelKey]++;

  if (currentItemIndex[channelKey] >= ch.items.length) {
    currentItemIndex[channelKey] = 0;
  }

  const next =
    ch.items[currentItemIndex[channelKey]];

  playMedia(channelKey, next);

  renderPlaylist();
}

function renderPlaylist() {
  const ch = MNTV_CHANNELS[currentChannel];
  const currentIdx = currentItemIndex[currentChannel];

  let html = '';

  ch.items.forEach((item, i) => {

    let icon = '🎬';

    if (item.type === 'audio') icon = '🎵';
    if (item.type === 'image') icon = '🖼️';
    if (item.type === 'youtube') icon = '📺';
    if (!item.file) icon = '📡';

    let badge = '';

    if (item.isLive) {
      badge = `<div class="item-badge live">LIVE</div>`;
    }
    else if (item.type === 'audio') {
      badge = `<div class="item-badge audio">AUDIO</div>`;
    }
    else if (item.type === 'image') {
      badge = `<div class="item-badge img">IMG</div>`;
    }
    else if (item.file) {
      badge = `<div class="item-badge vod">VOD</div>`;
    }

    html += `
      <div class="playlist-item ${i === currentIdx ? 'active' : ''}">
        <div class="thumb">
          ${
            item.thumb
              ? `<img src="${item.thumb}" onerror="this.style.display='none'">`
              : icon
          }
          ${badge}
        </div>

        <div class="playlist-title">
          ${item.title || 'No Signal'}
        </div>
      </div>
    `;
  });

  document.getElementById('playlist').innerHTML = html;
}

function updateClock() {
  const now = new Date();

  const options = {
    timeZone: 'Asia/Manila',
    hour12: true
  };

  document.getElementById('liveClock').textContent =
    now.toLocaleTimeString('en-PH', options) + ' PHT';
}

setInterval(updateClock, 1000);

document.addEventListener('DOMContentLoaded', () => {
  updateClock();
  switchChannel('news');
});
    </script>
</body>
</html>
