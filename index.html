<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maharlika National Television - MNTV</title>
  <style>
  :root {
  --mntv-blue: #0B3D80; 
  --mntv-red: #E10600; 
  --mntv-gold: #FFD700;   /* Gold - accents, borders, highlights */
  --mntv-white: #FFFFFF;  /* White - main text */
  --mntv-gray: #272727;   /* Dark gray - panels, controls, inactive items */
  --mntv-dark: #0F0F0F;   /* Near-black - main background */
}
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #5C0011;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }
    
    .tv-header {
      background: #0B3D80;
      border-bottom: 2px #0B3D80;
      padding: 5px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo-text h1 {
      font-size: 10px; /* was 5px, too small */
      color: var(--maharlikan-gold);
      line-height: 1;
    }
    
    .logo-text p {
      font-size: 5px;
      opacity: 0.9;
      color: var(--maharlikan-white);
    }
    
    #liveClock {
      font-family: monospace;
      font-size: 9px;
      background: #272727;
      color: var(--maharlikan-white);
      padding: 4px 8px;
      border-radius: 3px;
    }
    
    .ticker {
      background: gold;
      color: white;
      padding: 5px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 10px;
      font-weight: bold;
    }
    
    .ticker span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 20s linear infinite;
    }
    
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

.channel-bar {
      background: #000;
      border-bottom: 2px solid var(--mntv-gold);
      padding: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }
.ch-btn {
      background: red;
      color: white;
      border: 1px solid var(--mntv-gold);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
.ch-btn.active { background: green; }

.watch-container {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }
.player-section { flex: 1; min-width: 0; }
.playlist-section { width: 350px; }

.tv-player {
      background: #000;
      aspect-ratio: 16/9;
      border: 3px solid var(--mntv-gold);
      position: relative;
      overflow: hidden;
    }

.tv-player.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      aspect-ratio: unset;
      border: none;
      z-index: 9999;
    }

.fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 9998;
      backdrop-filter: blur(2px);
    }

.fullscreen-overlay.active {
      display: block;
    }

.fullscreen-exit-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(11, 61, 128, 0.9);
      color: white;
      border: 2px solid var(--mntv-gold);
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      display: none;
      z-index: 10000;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

.fullscreen-exit-btn.active {
      display: block;
    }

.fullscreen-exit-btn:hover {
      background: rgba(11, 61, 128, 1);
      transform: scale(1.05);
}

.channel-video,.channel-audio,.channel-image,.channel-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      border: none;
    }
.live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #E10600;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 9px;
      animation: pulse 2s infinite;
      z-index: 5;
    }
.vod-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #555;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 9px;
      z-index: 5;
    }
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
    }

.no-signal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(0deg, #222 0px, #222 1px, #333 1px, #333 2px),
        repeating-linear-gradient(90deg, #222 0px, #222 1px, #333 1px, #333 2px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #888;
      font-weight: bold;
      font-size: 24px;
      text-shadow: 2px 2px 4px #000;
    }

.radio-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a, #000);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
.radio-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--mntv-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 3px solid var(--mntv-gold);
    }
.waveform {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 40px;
    }
.waveform span {
      width: 4px;
      background: var(--mntv-gold);
      animation: wave 1.2s infinite ease-in-out;
    }
.waveform span:nth-child(2) { animation-delay: 0.1s; }
.waveform span:nth-child(3) { animation-delay: 0.2s; }
.waveform span:nth-child(4) { animation-delay: 0.3s; }
.waveform span:nth-child(5) { animation-delay: 0.4s; }
    @keyframes wave {
      0%, 100% { height: 10px; }
      50% { height: 40px; }
    }

.player-controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
.control-btn {
      background: #272727;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
.control-btn:hover { background: var(--mntv-blue); }
.control-btn svg { width: 20px; height: 20px; fill: currentColor; }

.video-info h2 { margin: 12px 0 5px; font-size: 20px; }
.video-meta { color: #aaa; font-size: 14px; }

.playlist-item {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      opacity: 0.7;
      position: relative;
      pointer-events: none;
      cursor: default;
    }
.playlist-item.active {
      opacity: 1;
      background: #272727;
      border-left: 3px solid var(--mntv-blue);
    }
.thumb {
      width: 120px;
      height: 68px;
      background: #333;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 24px;
    }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.playlist-title { font-size: 14px; line-height: 1.3; }
.item-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: bold;
    }
.item-badge.live { background: #E10600; }
.item-badge.vod { background: #555; }
.item-badge.audio { background: #0B3D80; }
.item-badge.img { background: #8B0000; }

    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-timeline,
    video::-webkit-media-controls-current-time-display,
    video::-webkit-media-controls-time-remaining-display,
    video::-webkit-media-controls-seek-back-button,
    video::-webkit-media-controls-seek-forward-button,
    video::-webkit-media-controls-fullscreen-button {
      display: none!important;
    }

    @media (max-width: 900px) {
.watch-container { flex-direction: column; }
.playlist-section { width: 100%; }
    }

    @media (max-width: 640px) {
      .fullscreen-exit-btn {
        top: 10px;
        right: 10px;
        padding: 10px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="tv-header">
      <div class="logo-text">
        <h1>Maharlika National Television</h1>
        <p>The State Media of the State Republic of Maharlika</p>
      </div>
    </div>
    <div id="liveClock">00:00:00 PHT</div>
  </header>
  <div class="ticker">
    <span> President Russel Cano announced the new Chief Justice of the Supreme Court </span>
  <div class="channel-bar">
    <button class="ch-btn active" onclick="switchChannel('news')">CH1: Maharlika News</button>
    <button class="ch-btn" onclick="switchChannel('sports')">CH2: Maharlika State Sports</button>
    <button class="ch-btn" onclick="switchChannel('music')">CH3: Music Channel</button>
    <button class="ch-btn" onclick="switchChannel('kids')">CH4: Cartoon TV</button>
    <button class="ch-btn" onclick="switchChannel('radio')">CH5: Radyo Maharlika</button>
    <button class='ch-btn' onclick="switchChannel('government')">CH6: State Republic of Maharlika State Network</button>
  </div>

  <div id="fullscreenOverlay" class="fullscreen-overlay"></div>
  <button id="fullscreenExitBtn" class="fullscreen-exit-btn" onclick="toggleFullscreen()">✕ Exit Fullscreen</button>

  <div class="watch-container">
    <div class="player-section">
      <div class="tv-player" id="tvPlayer">
        <div class="channel-badge" id="channelBadge">MNTV NEWS</div>
        <div id="statusBadge"></div>

        <video id="video-news" class="channel-video"></video>
        <video id="video-sports" class="channel-video"></video>
        <video id="video-music" class="channel-video"></video>
        <video id="video-kids" class="channel-video"></video>
        <video id="video-government" class="channel-video"></video>
        <audio id="audio-radio" class="channel-audio"></audio>
        <iframe id="iframe-news" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-sports" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-music" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-kids" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-government" class="channel-iframe" allowfullscreen="true"></iframe>
        <div id="radio-ui-radio" class="radio-ui">
          <div class="radio-logo">📻</div>
          <div id="radio-title" style="color:var(--mntv-gold);font-weight:bold;"></div>
          <div class="waveform"><span></span><span></span></div>
        </div>
        <img id="image-news" class="channel-image">
        <img id="image-sports" class="channel-image">
        <img id="image-music" class="channel-image">
        <img id="image-kids" class="channel-image">
        <img id="image-government" class="channel-image">

        <div id="channelContent"></div>
      </div>

      <div class="player-controls">
        <button class="control-btn" id="playBtn" onclick="togglePlay()" title="Play/Pause (Space)">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute (M)">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.82 7-9.31 0-4.49-3.01-8.27-7-9.18V3.23z"/></svg>
        </button>
        <button class="control-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <div class="video-info">
        <h2 id="videoTitle">Select a video</h2>
        <div class="video-meta" id="videoMeta">Maharlika National Television</div>
      </div>
    </div>

    <div class="playlist-section">
      <h3 style="margin-top:0;">Up Next</h3>
      <div id="playlist"></div>
    </div>
  </div>

  <script>
    const MNTV_CHANNELS = {
      news: {
        name: 'Maharlika News',
        type: 'youtube',
        isLive: true,
        file: 'HAFzcjuBAAo',
        items: [
          { title: 'Auld Lang Syne', type: 'youtube', file: 'HAFzcjuBAAo', isLive: true, thumb: null },
        ]
      },
      sports: {
        name: 'Maharlika State Sports',
        type: null,
        isLive: null,
        file: null,
        items: [
          { title: 'No Broadcast', type: null , file: null , isLive: false, thumb: null }
        ]
      },
      music: {
        name: 'Music Channel',
        type: 'youtube',
        isLive: false,
        file: 'dQw4w9WgXcQ',
        items: [
          { title: 'Never Gonna Give You Up', type: 'youtube', file: 'dQw4w9WgXcQ', isLive: false, thumb: null },
          { title: 'Music Video 2', type: 'youtube', file: 'jNQXAC9IVRw', isLive: false, thumb: null }
        ]
      },
      kids: {
        name: 'Cartoon Channel',
        type: 'youtube',
        isLive: true,
        file: 't0Q2otsqC4I',
        items: [
          { title: 'Tom and Jerry', type: 'youtube', file: '_GE6zf_hH48', isLive: false, thumb: null },
          { title: 'Cartoon Video', type: 'youtube', file: '_GE6zf_hH48', isLive: false, thumb: null }
        ]
      },
      radio: {
        name: 'Radio Maharlika',
        type: null,
        isLive: null,
        file: null,
        isRadio: false,
        items: [
          { title: 'NO BROADCAST', type: null, file: null, isLive: false, thumb: null }
        ]
      },
      government: {
        name: 'SRM State Channel',
        type: 'youtube',
        isLive: false,
        file: 'dQw4w9WgXcQ',
        items: [
          { title: 'Government Broadcast', type: 'youtube', file: 'dQw4w9WgXcQ', isLive: false, thumb: null }
        ]
      }
    };

    let currentChannel = 'news';
    let currentItemIndex = {};
    let isFullscreen = false;

    Object.keys(MNTV_CHANNELS).forEach(ch => {
      currentItemIndex[ch] = 0;
    });

    function hideAllMedia() {
      // Stop and hide all videos
      document.querySelectorAll('.channel-video').forEach(el => {
        el.pause();
        el.currentTime = 0;
        el.style.display = 'none';
      });
      
      // Stop and hide all audio
      document.querySelectorAll('.channel-audio').forEach(el => {
        el.pause();
        el.currentTime = 0;
        el.style.display = 'none';
      });
      
      // Clear all iframes
      document.querySelectorAll('.channel-iframe').forEach(el => {
        el.src = '';
        el.style.display = 'none';
      });
      
      // Hide radio UI
      document.querySelectorAll('.radio-ui').forEach(el => {
        el.style.display = 'none';
      });
      
      // Hide images
      document.querySelectorAll('.channel-image').forEach(el => {
        el.style.display = 'none';
      });
    }

    function togglePlay() {
      const ch = MNTV_CHANNELS[currentChannel];
      if (ch.type === 'youtube') return; // YouTube handles its own playback
      
      const mediaEl = document.getElementById(`${ch.type}-${currentChannel}`);
      if (!mediaEl) return;

      if (mediaEl.paused) {
        mediaEl.play().catch(() => console.log('Play failed'));
      } else {
        mediaEl.pause();
      }
      updatePlayButton();
    }

    function updatePlayButton() {
      const ch = MNTV_CHANNELS[currentChannel];
      const mediaEl = document.getElementById(`${ch.type}-${currentChannel}`);
      const btn = document.getElementById('playBtn');
      
      if (!mediaEl || ch.type === 'youtube') return;
      
      btn.innerHTML = mediaEl.paused
        ? `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>`;
    }

    function toggleMute() {
      const ch = MNTV_CHANNELS[currentChannel];
      if (ch.type === 'youtube') return;
      
      const mediaEl = document.getElementById(`${ch.type}-${currentChannel}`);
      if (!mediaEl) return;

      mediaEl.muted = !mediaEl.muted;
      const btn = document.getElementById('muteBtn');
      btn.innerHTML = mediaEl.muted
        ? `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0.94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.82 7-9.31 0-4.49-3.01-8.27-7-9.18V3.23zm-6.5 2.5l4 4h-4V6z"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.82 7-9.31 0-4.49-3.01-8.27-7-9.18V3.23z"/></svg>`;
    }

    function toggleFullscreen() {
      const player = document.getElementById('tvPlayer');
      const overlay = document.getElementById('fullscreenOverlay');
      const exitBtn = document.getElementById('fullscreenExitBtn');
      isFullscreen = !isFullscreen;
      
      if (isFullscreen) {
        player.classList.add('fullscreen');
        overlay.classList.add('active');
        exitBtn.classList.add('active');
        document.body.style.overflow = 'hidden';
        document.getElementById('fullscreenBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`;
      } else {
        player.classList.remove('fullscreen');
        overlay.classList.remove('active');
        exitBtn.classList.remove('active');
        document.body.style.overflow = 'auto';
        document.getElementById('fullscreenBtn').innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
      }
    }

    function switchChannel(channelKey) {
      hideAllMedia();
      currentChannel = channelKey;
      const ch = MNTV_CHANNELS[channelKey];

      document.querySelectorAll('.ch-btn').forEach((btn, i) => {
        btn.classList.toggle('active', Object.keys(MNTV_CHANNELS)[i] === channelKey);
      });

      document.getElementById('channelBadge').textContent = ch.name;

      const item = ch.items[currentItemIndex[channelKey]];
      playMedia(channelKey, item);
      renderPlaylist();
    }

    function playMedia(channelKey, item) {
      const ch = MNTV_CHANNELS[channelKey];
      const screen = document.getElementById('channelContent');
      screen.innerHTML = '';

      document.getElementById('videoTitle').textContent = item.title || 'No Signal';
      document.getElementById('videoMeta').textContent = ch.name;

      const badgeEl = document.getElementById('statusBadge');
      if (item.isLive) {
        badgeEl.className = 'live-badge';
        badgeEl.textContent = '● LIVE';
      } else if (item.file) {
        badgeEl.className = 'vod-badge';
        badgeEl.textContent = 'ON DEMAND';
      } else {
        badgeEl.innerHTML = '';
      }

      if (!item.file || item.type === null) {
        screen.innerHTML = `
          <div class="no-signal">
            <div>NO SIGNAL</div>
            <div style="font-size:14px;margin-top:10px;">Please stand by</div>
          </div>
        `;
        return;
      }

      if (item.type === 'video') {
        const video = document.getElementById(`video-${channelKey}`);
        if (!video.src || !video.src.includes(item.file)) {
          video.src = item.file;
          video.load();
          setupEndedListeners(video, channelKey);
        }
        video.muted = false;
        video.style.display = 'block';
        if (video.paused) video.play().catch(() => {
          video.muted = true;
          video.play().catch(e => console.log('Autoplay failed'));
        });
      }
      else if (item.type === 'youtube') {
        const iframe = document.getElementById(`iframe-${channelKey}`);
        iframe.src = `https://www.youtube.com/embed/${item.file}?autoplay=1&controls=0&modestbranding=1`;
        iframe.style.display = 'block';
      }
      else if (item.type === 'audio') {
        const audio = document.getElementById(`audio-${channelKey}`);
        if (!audio.src || !audio.src.includes(item.file)) {
          audio.src = item.file;
          audio.load();
          setupEndedListeners(audio, channelKey);
        }
        audio.muted = false;

        if (ch.isRadio) {
          document.getElementById(`radio-ui-${channelKey}`).style.display = 'flex';
          document.getElementById('radio-title').textContent = item.title;
        }

        if (audio.paused) audio.play().catch(() => {
          audio.muted = true;
          audio.play().catch(e => console.log('Autoplay failed'));
        });
      }
      else if (item.type === 'image') {
        const img = document.getElementById(`image-${channelKey}`);
        img.src = item.file;
        img.style.display = 'block';
      }

      updatePlayButton();
    }

    function setupEndedListeners(mediaEl, channelKey) {
      mediaEl.onended = null;
      mediaEl.onended = () => {
        const ch = MNTV_CHANNELS[channelKey];
        currentItemIndex[channelKey]++;

        if (currentItemIndex[channelKey] >= ch.items.length) {
          currentItemIndex[channelKey] = 0;
        }

        if (currentChannel === channelKey) {
          const nextItem = ch.items[currentItemIndex[channelKey]];
          playMedia(channelKey, nextItem);
          renderPlaylist();
        }
      };
    }

    function nextItem(channelKey) {
      if (currentChannel !== channelKey) return;

      const ch = MNTV_CHANNELS[channelKey];
      currentItemIndex[channelKey]++;

      if (currentItemIndex[channelKey] >= ch.items.length) {
        currentItemIndex[channelKey] = 0;
      }

      const nextItem = ch.items[currentItemIndex[channelKey]];
      playMedia(channelKey, nextItem);
      renderPlaylist();
    }

    function renderPlaylist() {
      const ch = MNTV_CHANNELS[currentChannel];
      const currentIdx = currentItemIndex[currentChannel];
      let html = '';

      ch.items.forEach((item, i) => {
        let icon = '🎬';
        if (item.type === 'audio') icon = '🎵';
        if (item.type === 'image') icon = '🖼️';
        if (item.type === 'youtube') icon = '▶️';
        if (!item.file) icon = '📡';

        let badge = '';
        if (item.isLive) badge = '<div class="item-badge live">LIVE</div>';
        else if (item.type === 'audio') badge = '<div class="item-badge audio">AUDIO</div>';
        else if (item.type === 'image') badge = '<div class="item-badge img">IMG</div>';
        else if (item.type === 'youtube') badge = '<div class="item-badge vod">YOUTUBE</div>';
        else if (item.file) badge = '<div class="item-badge vod">VOD</div>';

        html += `
          <div class="playlist-item ${i === currentIdx ? 'active' : ''}">
            <div class="thumb">
              ${item.thumb ? `<img src="${item.thumb}" onerror="this.style.display='none'">` : icon}
              ${badge}
            </div>
            <div class="playlist-title">${item.title || 'No Signal'}</div>
          </div>
        `;
      });
      document.getElementById('playlist').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
      switchChannel('news');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === ' ') { e.preventDefault(); togglePlay(); }
      if (e.key === 'm' || e.key === 'M') toggleMute();
      if (e.key === 'Escape') { if (isFullscreen) toggleFullscreen(); }
    });
    
    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Manila', hour12: true };
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-PH', options) + ' PHT';
    }
    setInterval(updateClock, 1000);
    updateClock();

  </script>
</body>
</html>
