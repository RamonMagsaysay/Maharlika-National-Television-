<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maharlika National Television - MNTV</title>
  <style>
  :root {
  --mntv-blue: #0B3D80; 
  --mntv-red: #E10600; 
  --mntv-gold: #FFD700;   /* Gold - accents, borders, highlights */
  --mntv-white: #FFFFFF;  /* White - main text */
  --mntv-gray: #272727;   /* Dark gray - panels, controls, inactive items */
  --mntv-dark: #0F0F0F;   /* Near-black - main background */
}
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #272727;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 0%, rgba(10, 168, 224, 0.2) 0%, transparent 70%);
    animation: bgPulse 10s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes bgPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
    
    .tv-header {
      background: #0B3D80;
      border-bottom: 2px #0B3D80;
      padding: 5px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo-text h1 {
      font-size: 10px; /* was 5px, too small */
      color: var(--maharlikan-gold);
      line-height: 1;
    }
    
    .logo-text p {
      font-size: 5px;
      opacity: 0.9;
      color: var(--maharlikan-white);
    }
    
    #liveClock {
      font-family: monospace;
      font-size: 9px;
      background: #272727;
      color: var(--maharlikan-white);
      padding: 4px 8px;
      border-radius: 3px;
    }

.channel-bar {
      background: #000;
      border-bottom: 2px solid var(--mntv-gold);
      padding: 10px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }
.ch-btn {
      background: red;
      color: white;
      border: 1px solid var(--mntv-gold);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }
.ch-btn.active { background: green; }

.watch-container {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }
.player-section { flex: 1; min-width: 0; }
.playlist-section { width: 350px; }

.tv-player {
  background: #000;
  aspect-ratio: 16/9;
  border: 3px solid var(--mntv-gold);
  position: relative;
  overflow: hidden;
}

/* ALL MEDIA */
.channel-video,
.channel-audio,
.channel-image,
#channelContent,
#channelContent iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* VIDEO */
.channel-video {
  object-fit: cover;
  display: none;
  background: #000;
}

/* IMAGE */
.channel-image {
  object-fit: contain;
  display: none;
  background: #000;
}

/* YOUTUBE */
#channelContent iframe {
  border: none;
  display: block;
}

/* RADIO */
.radio-ui {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 9998;
      backdrop-filter: blur(2px);
    }

.fullscreen-overlay.active {
      display: block;
    }

.fullscreen-exit-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(11, 61, 128, 0.9);
      color: white;
      border: 2px solid var(--mntv-gold);
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      display: none;
      z-index: 10000;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
ppp
.fullscreen-exit-btn.active {
      display: block;
    }

.fullscreen-exit-btn:hover {
      background: rgba(11, 61, 128, 1);
      transform: scale(1.05);
}

#channelContent {
  width: 100%;
  height: 0;
  padding-bottom: 56.25%;
  position: relative;
  background: #000;
}

#channelContent > div,
#channelContent iframe,
#channelContent video,
#channelContent img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
    
.channel-video,.channel-audio,.channel-image,.channel-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      border: none;
    }
.live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #E10600;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 9px;
      animation: pulse 2s infinite;
      z-index: 5;
    }
.vod-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #555;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 9px;
      z-index: 5;
    }
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
    }

.no-signal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(0deg, #222 0px, #222 1px, #333 1px, #333 2px),
        repeating-linear-gradient(90deg, #222 0px, #222 1px, #333 1px, #333 2px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #888;
      font-weight: bold;
      font-size: 24px;
      text-shadow: 2px 2px 4px #000;
    }

.radio-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a, #000);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
.radio-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--mntv-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 3px solid var(--mntv-gold);
    }
.waveform {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 40px;
    }
.waveform span {
      width: 4px;
      background: var(--mntv-gold);
      animation: wave 1.2s infinite ease-in-out;
    }
.waveform span:nth-child(2) { animation-delay: 0.1s; }
.waveform span:nth-child(3) { animation-delay: 0.2s; }
.waveform span:nth-child(4) { animation-delay: 0.3s; }
.waveform span:nth-child(5) { animation-delay: 0.4s; }
    @keyframes wave {
      0%, 100% { height: 10px; }
      50% { height: 40px; }
    }

.player-controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
.control-btn {
      background: #272727;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
.control-btn:hover { background: var(--mntv-blue); }
.control-btn svg { width: 20px; height: 20px; fill: currentColor; }

.video-info h2 { margin: 12px 0 5px; font-size: 20px; }
.video-meta { color: #aaa; font-size: 14px; }

.playlist-item {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      opacity: 0.7;
      position: relative;
      pointer-events: none;
      cursor: default;
    }
.playlist-item.active {
      opacity: 1;
      background: #272727;
      border-left: 3px solid var(--mntv-blue);
    }
.thumb {
      width: 120px;
      height: 68px;
      background: #333;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 24px;
    }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.playlist-title { font-size: 14px; line-height: 1.3; }
.item-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: bold;
    }
.item-badge.live { background: #E10600; }
.item-badge.vod { background: #555; }
.item-badge.audio { background: #0B3D80; }
.item-badge.img { background: #8B0000; }

  </style>
</head>
<body>
  <header class="tv-header">
      <div class="logo-text">
        <h1>Maharlika National Television</h1>
        <p>The State Media of the State Republic of Maharlika</p>
      </div>
    </div>
    <div id="liveClock">00:00:00 PHT</div>
  </header>
  <div class="channel-bar">
    <button class="ch-btn active" onclick="switchChannel('news')">CH1: Maharlika News</button>
    <button class="ch-btn" onclick="switchChannel('sports')">CH2: Maharlika State Sports</button>
    <button class="ch-btn" onclick="switchChannel('music')">CH3: Music Channel</button>
    <button class="ch-btn" onclick="switchChannel('kids')">CH4: Cartoon TV</button>
    <button class="ch-btn" onclick="switchChannel('radio')">CH5: Radyo Maharlika</button>
    <button class='ch-btn' onclick="switchChannel('government')">CH6: State Republic of Maharlika State Network</button>
  </div>

  <div id="fullscreenOverlay" class="fullscreen-overlay"></div>
  <button id="fullscreenExitBtn" class="fullscreen-exit-btn" onclick="toggleFullscreen()">✕ Exit Fullscreen</button>

  <div class="watch-container">
    <div class="player-section">
      <div class="tv-player" id="tvPlayer">
        <div class="channel-badge" id="channelBadge">MNTV NEWS</div>
        <div id="statusBadge"></div>

        <video id="video-news" class="channel-video"></video>
        <video id="video-sports" class="channel-video"></video>
        <video id="video-music" class="channel-video"></video>
        <video id="video-kids" class="channel-video"></video>
        <video id="video-government" class="channel-video"></video>
        <audio id="audio-radio" class="channel-audio"></audio>
        <iframe id="iframe-news" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-sports" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-music" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-kids" class="channel-iframe" allowfullscreen="true"></iframe>
        <iframe id="iframe-government" class="channel-iframe" allowfullscreen="true"></iframe>
        <div id="radio-ui-radio" class="radio-ui">
          <div class="radio-logo">📻</div>
          <div id="radio-title" style="color:var(--mntv-gold);font-weight:bold;"></div>
          <div class="waveform"><span></span><span></span></div>
        </div>
        <img id="image-news" class="channel-image">
        <img id="image-sports" class="channel-image">
        <img id="image-music" class="channel-image">
        <img id="image-kids" class="channel-image">
        <img id="image-government" class="channel-image">

        <div id="channelContent"></div>
      </div>
<div class="player-controls">

  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
    🔊
  </button>

  <button class="mute-btn" onclick="toggleFullscreen()">
    ⛶
  </button>

</div>

      <div class="video-info">
        <h2 id="videoTitle">Select a video</h2>
        <div class="video-meta" id="videoMeta">Maharlika National Television</div>
      </div>
    </div>

    <div class="playlist-section">
      <h3 style="margin-top:0;">Up Next</h3>
      <div id="playlist"></div>
    </div>
  </div>


    <script>
const MNTV_CHANNELS = {
  news: {
    name: 'Maharlika News',
    items: [
      {
        title: 'Auld Lang Syne',
        type: 'youtube',
        file: 'HAFzcjuBAAo',
        isLive: false,
        thumb: null
      }
    ]
  },

  sports: {
    name: 'Maharlika State Sports',
    items: [
      {
        title: 'Auld Lang Syne',
        type: 'youtube',
        file: 'HAFzcjuBAAo',
        isLive: false,
        thumb: null
      }
    ]
  },

  music: {
    name: 'Music Channel',
    items: [
      {
        title: 'Never Gonna Give You Up',
        type: 'youtube',
        file: 'jNQXAC9IVRw',
        isLive: false,
        thumb: null
      },
      {
        title: 'La Mentira',
        type: 'video',
        file: 'la_mentira.mp4',
        isLive: false,
        thumb: 'music_thumb1.jpg'
      }
    ]
  },

  kids: {
    name: 'Cartoon TV',
    items: [
      {
        title: 'Tom and Jerry',
        type: 'youtube',
        file: 't0Q2otsqC4I',
        isLive: true,
        thumb: null
      },
      {
        title: 'Tom and Jerry 2',
        type: 'youtube',
        file: 't0Q2otsqC4I',
        isLive: true,
        thumb: null
      }
    ]
  },

  radio: {
    name: 'Radio Maharlika',
    isRadio: true,
    items: [
      {
        title: 'Test Broadcast',
        type: 'audio',
        file: 'ocean_deep.mp3',
        isLive: false,
        thumb: null
      }
    ]
  },

  government: {
    name: 'SRM State Channel',
    items: [
      {
        title: 'No Broadcast',
        type: null,
        file: null,
        isLive: false,
        thumb: null
      }
    ]
  }
};

let currentChannel = 'news';
let currentItemIndex = {};

Object.keys(MNTV_CHANNELS).forEach(ch => {
  currentItemIndex[ch] = 0;
});

function hideAllMedia() {
  document.querySelectorAll(
    '.channel-video,.channel-audio,.channel-image,.radio-ui'
  ).forEach(el => {

    el.style.display = 'none';

    if (el.tagName === 'VIDEO' || el.tagName === 'AUDIO') {
      el.pause();
      el.currentTime = 0;
      el.muted = true;
    }
  });

  document.getElementById('channelContent').innerHTML = '';
}



function toggleMute() {
  const ch = MNTV_CHANNELS[currentChannel];
  const item = ch.items[currentItemIndex[currentChannel]];

  if (!item) return;

  let mediaEl = null;

  if (item.type === 'video') {
    mediaEl = document.getElementById(`video-${currentChannel}`);
  }

  if (item.type === 'audio') {
    mediaEl = document.getElementById(`audio-${currentChannel}`);
  }

  if (!mediaEl) return;

  mediaEl.muted = !mediaEl.muted;

  const btn = document.getElementById('muteBtn');

  btn.innerHTML = mediaEl.muted
    ? `
      <svg viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63z"/>
      </svg>
    `
    : `
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
      </svg>
    `;
}

function toggleFullscreen() {
  const player = document.getElementById('tvPlayer');

  if (!document.fullscreenElement) {

    if (player.requestFullscreen) {
      player.requestFullscreen();
    }
    else if (player.webkitRequestFullscreen) {
      player.webkitRequestFullscreen();
    }
    else if (player.msRequestFullscreen) {
      player.msRequestFullscreen();
    }

  } else {

    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
    else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }

  }
}

function switchChannel(channelKey) {
  currentChannel = channelKey;

  const ch = MNTV_CHANNELS[channelKey];

  if (
    currentItemIndex[channelKey] == null ||
    currentItemIndex[channelKey] >= ch.items.length
  ) {
    currentItemIndex[channelKey] = 0;
  }

  document.querySelectorAll('.ch-btn').forEach((btn, i) => {
    btn.classList.toggle(
      'active',
      Object.keys(MNTV_CHANNELS)[i] === channelKey
    );
  });

  document.getElementById('channelBadge').textContent = ch.name;

  const item = ch.items[currentItemIndex[channelKey]];

  playMedia(channelKey, item);

  renderPlaylist();
}

function playMedia(channelKey, item) {
  hideAllMedia();

  const ch = MNTV_CHANNELS[channelKey];
  const screen = document.getElementById('channelContent');

  document.getElementById('videoTitle').textContent =
    item?.title || 'No Signal';

  document.getElementById('videoMeta').textContent =
    ch.name;

  const badgeEl = document.getElementById('statusBadge');

  if (item?.isLive) {
    badgeEl.className = 'live-badge';
    badgeEl.textContent = '● LIVE';
  }
  else if (item?.file) {
    badgeEl.className = 'vod-badge';
    badgeEl.textContent = 'ON DEMAND';
  }
  else {
    badgeEl.className = '';
    badgeEl.innerHTML = '';
  }

  // NO SIGNAL
  if (!item || !item.file || item.type === null) {
    screen.innerHTML = `
      <div class="no-signal">
        <div>NO SIGNAL</div>
        <div style="font-size:14px;margin-top:10px;">
          Please stand by
        </div>
      </div>
    `;
    return;
  }

  // VIDEO
  if (item.type === 'video') {
    const video = document.getElementById(`video-${channelKey}`);

    if (!video) return;

    video.style.display = 'block';

    if (!video.src.includes(item.file)) {
      video.src = item.file;
      video.load();
      setupEndedListeners(video, channelKey);
    }

    video.muted = false;

    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  }

  // AUDIO
  else if (item.type === 'audio') {
    const audio = document.getElementById(`audio-${channelKey}`);

    if (!audio) return;

    if (!audio.src.includes(item.file)) {
      audio.src = item.file;
      audio.load();
      setupEndedListeners(audio, channelKey);
    }

    audio.style.display = 'block';
    audio.muted = false;

    if (ch.isRadio) {
      const radioUI =
        document.getElementById(`radio-ui-${channelKey}`);

      if (radioUI) {
        radioUI.style.display = 'flex';
      }

      document.getElementById('radio-title').textContent =
        item.title;
    }

    audio.play().catch(() => {
      audio.muted = true;
      audio.play().catch(() => {});
    });
  }

  // IMAGE
  else if (item.type === 'image') {
    const img = document.getElementById(`image-${channelKey}`);

    if (!img) return;

    img.src = item.file;
    img.style.display = 'block';
  }

  // YOUTUBE
  else if (item.type === 'youtube') {

  screen.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${item.file}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1"
      title="${item.title}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;
  }

function setupEndedListeners(mediaEl, channelKey) {
  mediaEl.onended = null;

  mediaEl.onended = () => {
    const ch = MNTV_CHANNELS[channelKey];

    currentItemIndex[channelKey]++;

    if (currentItemIndex[channelKey] >= ch.items.length) {
      currentItemIndex[channelKey] = 0;
    }

    if (currentChannel === channelKey) {
      const next =
        ch.items[currentItemIndex[channelKey]];

      playMedia(channelKey, next);

      renderPlaylist();
    }
  };
}

function nextItem(channelKey) {
  const ch = MNTV_CHANNELS[channelKey];

  currentItemIndex[channelKey]++;

  if (currentItemIndex[channelKey] >= ch.items.length) {
    currentItemIndex[channelKey] = 0;
  }

  const next =
    ch.items[currentItemIndex[channelKey]];

  playMedia(channelKey, next);

  renderPlaylist();
}

function renderPlaylist() {
  const ch = MNTV_CHANNELS[currentChannel];
  const currentIdx = currentItemIndex[currentChannel];

  let html = '';

  ch.items.forEach((item, i) => {

    let icon = '🎬';

    if (item.type === 'audio') icon = '🎵';
    if (item.type === 'image') icon = '🖼️';
    if (item.type === 'youtube') icon = '📺';
    if (!item.file) icon = '📡';

    let badge = '';

    if (item.isLive) {
      badge = `<div class="item-badge live">LIVE</div>`;
    }
    else if (item.type === 'audio') {
      badge = `<div class="item-badge audio">AUDIO</div>`;
    }
    else if (item.type === 'image') {
      badge = `<div class="item-badge img">IMG</div>`;
    }
    else if (item.file) {
      badge = `<div class="item-badge vod">VOD</div>`;
    }

    html += `
      <div class="playlist-item ${i === currentIdx ? 'active' : ''}">
        <div class="thumb">
          ${
            item.thumb
              ? `<img src="${item.thumb}" onerror="this.style.display='none'">`
              : icon
          }
          ${badge}
        </div>

        <div class="playlist-title">
          ${item.title || 'No Signal'}
        </div>
      </div>
    `;
  });

  document.getElementById('playlist').innerHTML = html;
}

function updateClock() {
  const now = new Date();

  const options = {
    timeZone: 'Asia/Manila',
    hour12: true
  };

  document.getElementById('liveClock').textContent =
    now.toLocaleTimeString('en-PH', options) + ' PHT';
}

setInterval(updateClock, 1000);

document.addEventListener('DOMContentLoaded', () => {
  updateClock();
  switchChannel('news');
});
    </script>
</body>
</html>
